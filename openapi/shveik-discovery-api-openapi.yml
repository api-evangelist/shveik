  name: Discovery
paths:
  /endpoints:
    get:
      description: Lists the paid endpoints with their paths and quote URLs, the same entries as the /v1 index. Pages hold limit entries (default 10, at most 50); when next_cursor is not null, pass it back as cursor for the next page. A malformed limit or cursor is a 400 error.
      operationId: listEndpoints
      parameters:
      - description: Entries per page.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 50
          minimum: 1
          type: integer
      - description: 'Opaque cursor: the next_cursor of the previous page.'
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      type: object
                    type: array
                  next_cursor:
                    description: Cursor of the next page; null on the last page.
                    type:
                    - string
                    - 'null'
                  total:
                    description: Number of endpoints in the whole list.
                    minimum: 0
                    type: integer
                required:
                - items
                - next_cursor
                - total
                type: object
          description: One page of endpoints.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid limit or cursor (error invalid_request).
      summary: List the API endpoints, one page at a time
      tags:
      - Discovery
    servers:
    - description: Current stable API routes; legacy unversioned routes remain available.
      url: https://agdata.shveik.dev/v1
    - description: Unversioned compatibility routes.
      url: https://agdata.shveik.dev
components:
  schemas:
    Error:
      additionalProperties: true
      properties:
        error:
          description: 'a short stable code: invalid_request, invalid_payment, body_too_large, payment_in_progress, rate_limited, unavailable, upstream_failed, not_fetched, settlement_failed, expired, internal_error, not_found, method_not_allowed'
          type: string
        message:
          description: a human sentence
          type: string
      required:
      - error
      - message
      type: object
  securitySchemes:
    mpp:
      description: MPP evm/authorization credential in Authorization header. First request without payment returns WWW-Authenticate challenge.
      scheme: Payment
      type: http
    x402:
      description: x402 exact payment credential. First request without payment returns PAYMENT-REQUIRED quote.
      in: header
      name: PAYMENT-SIGNATURE
      type: apiKey
