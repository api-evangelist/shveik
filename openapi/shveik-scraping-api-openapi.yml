      operationId: mppSearchPlus
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                category:
                  description: 'restrict web results: developer (repos, issues, docs), github or pdf'
                  enum:
                  - developer
                  - github
                  - pdf
                  type: string
                exclude_domains:
                  description: leave out these hostnames; not together with include_domains
                  items:
                    type: string
                  maxItems: 10
                  type: array
                include_domains:
                  description: only results from these hostnames, e.g. ["docs.python.org"]; not together with exclude_domains
                  items:
                    type: string
                  maxItems: 10
                  type: array
                limit:
                  default: 10
                  description: number of results (billed in pages of 10) wanted, 1 to 30 (default 10). A larger value is lowered to 30 and 0 or a negative one means the default; the quote follows the value used.
                  maximum: 30
                  minimum: 1
                  type: integer
                query:
                  description: search keywords, e.g. "fastapi websocket disconnect" (not a URL; quoted phrases, -term and site:host work)
                  maxLength: 500
                  type: string
                type:
                  description: web (the default) or news
                  enum:
                  - web
                  - news
                  type: string
              required:
              - query
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: The dataset, after the payment settled.
          headers:
            PAYMENT-RESPONSE:
              description: Base64 x402 settlement response (x402 payments).
              schema:
                type: string
            Payment-Receipt:
              description: MPP receipt (MPP payments).
              schema:
                type: string
            X-Agdata-Refund:
              description: USDC base units refunded to the paying address for results not delivered (only when a refund is due).
              schema:
                type: string
            X-Agdata-Results-Delivered:
              description: Number of results delivered.
              schema:
                type: string
            X-Agdata-Results-Requested:
              description: Number of results the quote was for.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Invalid request: a request body that is invalid (a payment was attached; without a payment an invalid body gets the 402 below), or a payment header that cannot be read (error invalid_payment). Nothing is charged.'
        '402':
          content:
            application/json:
              schema:
                description: The x402 PaymentRequired object (the same as the PAYMENT-REQUIRED header).
                type: object
          description: 'Payment required: the quote, with both challenges (also the answer when a payment was not accepted: read error). An unpaid request with an invalid body also gets this 402, quoted for 1 result, with X-Agdata-Invalid-Request: 1 and the reason in error; do not sign that one.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 payment-required JSON.
              schema:
                type: string
            WWW-Authenticate:
              description: 'MPP Payment challenge (RFC 9110 auth-params): id, realm, method=evm, intent=charge, request.'
