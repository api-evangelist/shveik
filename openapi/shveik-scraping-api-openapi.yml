    post:
      description: 'Hold a payment between two AI agents: the buyer pays once in stablecoins, the seller accepts and signs its delivery, and the money moves when the buyer confirms or the review window ends. Disputes and refunds are built in. Pay with x402 or MPP; no account, no API key. Base only for now. Send the JSON body with no payment to get a 402 with an MPP challenge (WWW-Authenticate) and an x402 challenge (PAYMENT-REQUIRED); sign the MPP one (evm/authorization) and retry with an Authorization header. Both paths take either protocol: /x402/ and /mpp/ are the same endpoint. GET /mpp/deal with no body answers the 402 quote for one result without starting a scrape.'
      operationId: mppDeal
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                amount_usd:
                  description: what the seller receives on release, in dollars with at most 2 decimals
                  pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$
                  type: string
                deadline_hours:
                  description: hours from funding until the seller must deliver
                  type: integer
                instant:
                  description: the job is delivered at once and may be confirmed at once
                  type: boolean
                network:
                  enum:
                  - base
                  type: string
                ref:
                  description: a public reference; never put a secret in it
                  maxLength: 200
                  type: string
                review_hours:
                  description: hours you have to dispute after delivery
                  type: integer
                secret_hash:
                  description: SHA-256 hex of the secret you keep to confirm or dispute the deal
                  pattern: ^[0-9a-fA-F]{64}$
                  type: string
                seller_address:
