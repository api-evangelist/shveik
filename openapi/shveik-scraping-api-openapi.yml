paths:
  /mpp/amazon:
    post:
      description: 'Keyword search on Amazon.com (US store): up to 20 products per call, each filled in from its product page. Body: {query, limit}. The normalized object per product: asin, title, brand, price, list_price, currency, rating, reviews_count, in_stock, seller, image, url, description and the features bullet list. Good for price checks and product comparison. Send the JSON body with no payment to get a 402 with an MPP challenge (WWW-Authenticate) and an x402 challenge (PAYMENT-REQUIRED); sign the MPP one (evm/authorization) and retry with an Authorization header. Both paths take either protocol: /x402/ and /mpp/ are the same endpoint. GET /mpp/amazon with no body answers the 402 quote for one result without starting a scrape.'
      operationId: mppAmazon
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              properties:
                limit:
                  default: 5
                  description: number of products wanted, 1 to 20 (default 5). A larger value is lowered to 20 and 0 or a negative one means the default; the quote follows the value used.
                  maximum: 20
                  minimum: 1
                  type: integer
                query:
                  description: Amazon search term, e.g. "wireless keyboard"
                  maxLength: 500
                  type: string
              required:
              - query
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: The dataset, after the payment settled.
          headers:
            PAYMENT-RESPONSE:
              description: Base64 x402 settlement response (x402 payments).
              schema:
                type: string
            Payment-Receipt:
              description: MPP receipt (MPP payments).
              schema:
                type: string
            X-Agdata-Refund:
              description: USDC base units refunded to the paying address for results not delivered (only when a refund is due).
              schema:
                type: string
            X-Agdata-Results-Delivered:
              description: Number of results delivered.
              schema:
                type: string
            X-Agdata-Results-Requested:
              description: Number of results the quote was for.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Invalid request: a request body that is invalid (a payment was attached; without a payment an invalid body gets the 402 below), or a payment header that cannot be read (error invalid_payment). Nothing is charged.'
        '402':
          content:
            application/json:
              schema:
                description: The x402 PaymentRequired object (the same as the PAYMENT-REQUIRED header).
                type: object
          description: 'Payment required: the quote, with both challenges (also the answer when a payment was not accepted: read error). An unpaid request with an invalid body also gets this 402, quoted for 1 result, with X-Agdata-Invalid-Request: 1 and the reason in error; do not sign that one.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 payment-required JSON.
              schema:
                type: string
            WWW-Authenticate:
              description: 'MPP Payment challenge (RFC 9110 auth-params): id, realm, method=evm, intent=charge, request.'
              schema:
                type: string
            X-Agdata-Invalid-Request:
              description: 1 when the request body is invalid and the quote is for 1 result only.
              schema:
                type: string
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'The same payment is already being worked on: wait and retry with the same payment.'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request body is over 65536 bytes.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Idempotency-Key was already used with a different request body.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Internal error: no payment was settled for it.'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Nothing was delivered: a call that delivers nothing. Error not_fetched; the payment is not settled and nothing is charged. Also the answer when the upstream failed (upstream_failed) or the payment could not be settled (settlement_failed).'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Temporarily unavailable (the endpoint, a payment network or the upstream is switched off or over its failure budget): no payment was taken. Try again later.'
      summary: Amazon product search
      tags:
      - Scraping
      x-payment-info:
        price:
          currency: USD
          max: '0.417'
          min: '0.037'
          mode: dynamic
        protocols:
        - mpp:
            currency: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            intent: charge
            method: evm
      x-quote-probe:
        description: GET /mpp/amazon with no body answers the 402 quote for one result without starting a scrape. A quote for a request-specific limit needs this POST body.
        method: GET
    servers:
    - description: Current stable API routes; legacy unversioned routes remain available.
      url: https://agdata.shveik.dev/v1
    - description: Unversioned compatibility routes.
      url: https://agdata.shveik.dev
  /mpp/amazon-reviews:
    post:
      description: 'Amazon product reviews API for AI agents: send an ASIN or an Amazon product URL and get up to 50 customer reviews as JSON: rating, title, text, date, verified-purchase flag and helpful votes. Sort by recent or helpful, filter by stars, and pick the marketplace (US, UK, DE, FR, IT, ES, CA, JP). Reviewer names and photos are not returned. A product with no reviews is not charged. Send the JSON body with no payment to get a 402 with an MPP challenge (WWW-Authenticate) and an x402 challenge (PAYMENT-REQUIRED); sign the MPP one (evm/authorization) and retry with an Authorization header. Both paths take either protocol: /x402/ and /mpp/ are the same endpoint. Not offered on Solana: pay on Base or Polygon. GET /mpp/amazon-reviews with no body answers the 402 quote for one result without starting a scrape.'
      operationId: mppAmazonReviews
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                country:
                  default: us
                  description: Amazon marketplace of an ASIN (a URL sets its own; a different value is refused)
                  enum:
                  - us
                  - uk
                  - de
                  - fr
                  - it
                  - es
                  - ca
                  - jp
                  type: string
                limit:
                  default: 10
                  description: number of reviews wanted, 1 to 50 (default 10). A larger value is lowered to 50 and 0 or a negative one means the default; the quote follows the value used.
                  maximum: 50
                  minimum: 1
                  type: integer
                product:
                  description: an ASIN (10 characters, e.g. B079JLY5M5) or an Amazon product URL (.../dp/ASIN) on amazon.com, .co.uk, .de, .fr, .it, .es, .ca or .co.jp; a URL sets the marketplace
                  maxLength: 2048
                  type: string
                sort:
                  default: recent
                  description: order of the reviews
                  enum:
                  - recent
                  - helpful
                  type: string
                stars:
                  default: all
                  description: keep only reviews with this many stars (5 to 1), the positive ones (4 and 5) or the critical ones (1 to 3)
                  enum:
                  - all
                  - '5'
                  - '4'
                  - '3'
                  - '2'
                  - '1'
                  - positive
                  - critical
                  type: string
              required:
              - product
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: The dataset, after the payment settled.
          headers:
            PAYMENT-RESPONSE:
              description: Base64 x402 settlement response (x402 payments).
              schema:
                type: string
            Payment-Receipt:
              description: MPP receipt (MPP payments).
              schema:
                type: string
            X-Agdata-Refund:
              description: USDC base units refunded to the paying address for results not delivered (only when a refund is due).
              schema:
                type: string
            X-Agdata-Results-Delivered:
              description: Number of results delivered.
              schema:
                type: string
            X-Agdata-Results-Requested:
              description: Number of results the quote was for.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Invalid request: a request body that is invalid (a payment was attached; without a payment an invalid body gets the 402 below), or a payment header that cannot be read (error invalid_payment). Nothing is charged.'
        '402':
          content:
            application/json:
              schema:
                description: The x402 PaymentRequired object (the same as the PAYMENT-REQUIRED header).
                type: object
          description: 'Payment required: the quote, with both challenges (also the answer when a payment was not accepted: read error). An unpaid request with an invalid body also gets this 402, quoted for 1 result, with X-Agdata-Invalid-Request: 1 and the reason in error; do not sign that one.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 payment-required JSON.
              schema:
                type: string
            WWW-Authenticate:
              description: 'MPP Payment challenge (RFC 9110 auth-params): id, realm, method=evm, intent=charge, request.'
              schema:
                type: string
            X-Agdata-Invalid-Request:
              description: 1 when the request body is invalid and the quote is for 1 result only.
              schema:
                type: string
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'The same payment is already being worked on: wait and retry with the same payment.'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request body is over 65536 bytes.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Idempotency-Key was already used with a different request body.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Internal error: no payment was settled for it.'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Nothing was delivered: a product with no reviews (or an unknown one). Error not_fetched; the payment is not settled and nothing is charged. Also the answer when the upstream failed (upstream_failed) or the payment could not be settled (settlement_failed).'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Temporarily unavailable (the endpoint, a payment network or the upstream is switched off or over its failure budget): no payment was taken. Try again later.'
      summary: Amazon customer reviews of a product
      tags:
