                  type: boolean
                network:
                  enum:
                  - base
                  type: string
                ref:
                  description: a public reference; never put a secret in it
                  maxLength: 200
                  type: string
                review_hours:
                  description: hours you have to dispute after delivery
                  type: integer
                secret_hash:
                  description: SHA-256 hex of the secret you keep to confirm or dispute the deal
                  pattern: ^[0-9a-fA-F]{64}$
                  type: string
                seller_address:
                  description: the seller's EVM address; it proves control of it with one signature later
                  pattern: ^0x[0-9a-fA-F]{40}$
                  type: string
              required:
              - amount_usd
              - seller_address
              - network
              - secret_hash
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: The dataset, after the payment settled.
          headers:
            PAYMENT-RESPONSE:
              description: Base64 x402 settlement response (x402 payments).
              schema:
                type: string
            Payment-Receipt:
              description: MPP receipt (MPP payments).
              schema:
                type: string
            X-Agdata-Refund:
              description: USDC base units refunded to the paying address for results not delivered (only when a refund is due).
              schema:
                type: string
            X-Agdata-Results-Delivered:
              description: Number of results delivered.
              schema:
                type: string
            X-Agdata-Results-Requested:
              description: Number of results the quote was for.
              schema:
                type: string
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Settlement outcome is ambiguous; do not submit a new payment. For this deal endpoint, poll the returned GET /v1/deals/{id} status route; it reports pending/funded and subsequent deal state.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Invalid request: a request body that is invalid (a payment was attached; without a payment an invalid body gets the 402 below), or a payment header that cannot be read (error invalid_payment). Nothing is charged.'
        '402':
          content:
            application/json:
              schema:
                description: The x402 PaymentRequired object (the same as the PAYMENT-REQUIRED header).
                type: object
          description: 'Payment required: the quote, with both challenges (also the answer when a payment was not accepted: read error). An unpaid request with an invalid body also gets this 402, quoted for 1 result, with X-Agdata-Invalid-Request: 1 and the reason in error; do not sign that one.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 payment-required JSON.
              schema:
                type: string
            WWW-Authenticate:
              description: 'MPP Payment challenge (RFC 9110 auth-params): id, realm, method=evm, intent=charge, request.'
              schema:
                type: string
            X-Agdata-Invalid-Request:
              description: 1 when the request body is invalid and the quote is for 1 result only.
              schema:
                type: string
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'The same payment is already being worked on: wait and retry with the same payment.'
        '410':
          content:
            application/json:
              schema:
