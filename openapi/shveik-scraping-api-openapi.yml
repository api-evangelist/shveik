  - x-api-lifecycle differs across the merged source definitions and was not carried
  - x-guidance differs across the merged source definitions and was not carried
  description: 'Operations tagged Scraping across 5 of this provider''s published API definitions: agdata-openapi.json, agmail-openapi.json, agpay-openapi.json, agproxy-openapi.json, agvps-openapi.json. Each path carries the servers of the definition it was published in.'
