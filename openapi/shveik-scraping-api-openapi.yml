      description: 'Get an email address for your agent for four hours: name@agmail.shveik.dev, a name of your choice or a random one. Pay in stablecoins with x402 or MPP, no account and no card. Wait for the verification mail with one call and get the code or the link back. Receive only. Extend it by paying again. Send the JSON body with no payment to get a 402 with an MPP challenge (WWW-Authenticate) and an x402 challenge (PAYMENT-REQUIRED); sign the MPP one (evm/authorization) and retry with an Authorization header. Both paths take either protocol: /x402/ and /mpp/ are the same endpoint. GET /mpp/inbox-4h with no body answers the 402 quote for one result without starting a scrape.'
      operationId: mppInbox4h
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                name:
                  description: the local part of the address; omit it for a random name
                  maxLength: 32
                  minLength: 3
                  pattern: ^[a-zA-Z0-9]([a-zA-Z0-9._-]{1,30})[a-zA-Z0-9]$
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
          description: The dataset, after the payment settled.
          headers:
            PAYMENT-RESPONSE:
              description: Base64 x402 settlement response (x402 payments).
              schema:
                type: string
            Payment-Receipt:
              description: MPP receipt (MPP payments).
              schema:
                type: string
            X-Agdata-Refund:
              description: USDC base units refunded to the paying address for results not delivered (only when a refund is due).
              schema:
                type: string
            X-Agdata-Results-Delivered:
              description: Number of results delivered.
              schema:
                type: string
            X-Agdata-Results-Requested:
              description: Number of results the quote was for.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Invalid request: a request body that is invalid (a payment was attached; without a payment an invalid body gets the 402 below), or a payment header that cannot be read (error invalid_payment). Nothing is charged.'
        '402':
          content:
            application/json:
              schema:
                description: The x402 PaymentRequired object (the same as the PAYMENT-REQUIRED header).
                type: object
          description: 'Payment required: the quote, with both challenges (also the answer when a payment was not accepted: read error). An unpaid request with an invalid body also gets this 402, quoted for 1 result, with X-Agdata-Invalid-Request: 1 and the reason in error; do not sign that one.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 payment-required JSON.
              schema:
                type: string
            WWW-Authenticate:
              description: 'MPP Payment challenge (RFC 9110 auth-params): id, realm, method=evm, intent=charge, request.'
              schema:
                type: string
            X-Agdata-Invalid-Request:
              description: 1 when the request body is invalid and the quote is for 1 result only.
              schema:
                type: string
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'The same payment is already being worked on: wait and retry with the same payment.'
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'The stored copy of this payment''s result has expired (error expired): nothing is charged or run; sign a new payment to ask again.'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request body is over 65536 bytes.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Idempotency-Key was already used with a different request body.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Too many calls for this host or route are in flight (Retry-After: 5): no payment was taken.'
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Internal error: no payment was settled for it.'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The upstream scrape failed (error upstream_failed), or the payment could not be settled (settlement_failed). Nothing is delivered; an upstream failure is not charged.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Temporarily unavailable (the endpoint, a payment network or the upstream is switched off or over its failure budget): no payment was taken. Try again later.'
      summary: Inbox for four hours
      tags:
      - Scraping
      x-payment-info:
        price:
          amount: '0.05'
          currency: USD
          mode: fixed
        protocols:
        - mpp:
            currency: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            intent: charge
            method: evm
      x-quote-probe:
        description: GET /mpp/inbox-4h with no body answers the 402 quote for one result without starting a scrape. A quote for a request-specific limit needs this POST body.
        method: GET
    servers:
    - description: Current stable API routes; legacy unversioned routes remain available.
      url: https://agmail.shveik.dev/v1
    - description: Unversioned compatibility routes.
      url: https://agmail.shveik.dev
