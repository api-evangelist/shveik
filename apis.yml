aid: shveik
name: shveik
description: 'shveik.dev runs five pay-per-call APIs built for AI agents and paid per request in stablecoins
  over x402 and MPP, with no account or subscription: agdata (unblocking and web data - any URL as Markdown,
  screenshots, transcripts, maps and social data), agproxy (residential proxy packs and raw fetch), agvps
  (monthly Linux servers), agmail (hourly email inboxes with OTP extraction) and agpay (escrow-style holds
  between agents). Each ships an OpenAPI 3.1 contract and a remote MCP server.'
